name: Bug report
description: Something in honest-agent doesn't work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check [Troubleshooting](https://thehonestagent.dev/docs/troubleshooting/) first.
        Remove tokens, URLs and account names you'd rather not share from anything you paste.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: debug
    attributes:
      label: Output of `honest-agent debug`
      render: text
  - type: input
    id: version
    attributes:
      label: honest-agent version
      description: The output of `honest-agent --version`.
    validations:
      required: true
  - type: dropdown
    id: server
    attributes:
      label: MCP server
      options:
        - Snowflake managed MCP server
        - MotherDuck
        - The bundled example
        - Another server
