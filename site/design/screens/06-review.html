<style>
body{margin:0}
.s5{box-sizing:border-box;background:#EEF0E8;color:#1C2A22;font-family:'Geist',ui-sans-serif,system-ui,sans-serif;font-size:15px;line-height:1.5;padding:72px 32px 96px}
.s5 .wrap{max-width:1240px;margin:0 auto}
.s5 input.r{position:absolute;opacity:0;pointer-events:none}
.s5 .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.75fr);gap:48px;align-items:start}
.s5 .eyebrow{display:flex;align-items:center;gap:14px;font-family:'Geist Mono',monospace;font-size:18px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#7C877F}
.s5 .eyebrow .n{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:999px;background:#588157;border:1.5px solid #A3B18A;box-sizing:border-box;color:#1F2E26;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:0}
.s5 h2{margin:14px 0 10px;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:40px;line-height:1.08;letter-spacing:-.02em;text-wrap:balance}
.s5 .intro{margin:0 0 28px;font-size:17px;line-height:1.55;color:#4E5C52}
.s5 .ops{display:flex;flex-direction:column;gap:8px}
.s5 .op{display:block;padding:14px 16px;border:1px solid #DAD7CD;border-radius:12px;cursor:pointer;transition:background .15s,border-color .15s}
.s5 .op:hover{background:#F5F6F0}
.s5 .ot{font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:17px;color:#4E5C52}
.s5 .od{display:none;margin-top:4px;font-size:14px;line-height:1.45;color:#4E5C52}
#v1:checked ~ .grid .op1,#v2:checked ~ .grid .op2,#v3:checked ~ .grid .op3{background:#FBFAF6;border-color:#A3B18A}
#v1:checked ~ .grid .op1 .ot,#v2:checked ~ .grid .op2 .ot,#v3:checked ~ .grid .op3 .ot{color:#1C2A22}
#v1:checked ~ .grid .op1 .od,#v2:checked ~ .grid .op2 .od,#v3:checked ~ .grid .op3 .od{display:block}
.s5 .more{display:inline-block;margin-top:24px;font-weight:500;color:#588157;text-decoration:none}
.s5 .more:hover{color:#3A5A40;text-decoration:underline;text-underline-offset:3px}
.s5 .br{background:#FBFAF6;border:1px solid #D5D8CF;border-radius:14px;overflow:hidden;box-shadow:0 4px 8px rgba(22,33,27,.08),0 18px 36px rgba(22,33,27,.14),0 40px 80px -10px rgba(22,33,27,.24)}
.s5 .bar{display:flex;align-items:center;gap:8px;padding:0 14px;height:40px;background:#E6E8E0;border-bottom:1px solid #D5D8CF}
.s5 .bar i{width:11px;height:11px;border-radius:99px;background:#C4C9BE;display:block}
.s5 .url{margin-left:14px;flex:1;max-width:420px;height:24px;border-radius:7px;background:#F6F7F2;border:1px solid #DADDD3;font-family:'Geist Mono',monospace;font-size:12px;color:#5C6A60;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.s5 .url span{overflow:hidden;text-overflow:ellipsis}
.s5 .url span{display:none}
#v1:checked ~ .grid .u1,#v2:checked ~ .grid .u2,#v3:checked ~ .grid .u3{display:inline}
.s5 .vp{height:560px;overflow-y:auto;overflow-x:hidden;background:#F3F2EC;scrollbar-width:thin}
.s5 .view{display:none}
#v1:checked ~ .grid .w1,#v2:checked ~ .grid .w2,#v3:checked ~ .grid .w3{display:block}
.s5 .pg{position:relative;width:100%}
.s5 .pg img.base{display:block;width:100%;height:100%}
.s5 .hs{position:absolute;z-index:2;cursor:default}
.s5 .hs.go{cursor:pointer}
.s5 .hv{position:absolute;z-index:1;display:none;pointer-events:none}
.s5 .hs:hover + .hv{display:block}
.s5 .nav:hover{background:rgba(28,42,34,.06);border-radius:6px}
@keyframes fadeV{from{opacity:0}to{opacity:1}}
.s5 .view{animation:fadeV .25s ease-out}
@media (max-width:900px){
 .s5{padding:48px 16px 64px}
 .s5 .grid{grid-template-columns:minmax(0,1fr);gap:28px}
 .s5 h2{font-size:30px}.s5 .intro{font-size:16px}
 .s5 .vp{height:440px}.s5 .url{max-width:none}
}
@media (prefers-reduced-motion:reduce){.s5 .view{animation:none}}
</style>

</head>
